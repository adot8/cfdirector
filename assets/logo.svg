  <!-- redirect arrow pointer where the little star sits -->
  <g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M165 118 H228"/>
    <path d="M208 98 L232 118 L208 138"/>
  </g>
  <text x="200" y="202" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#fff">Cloudfla<tspan fill="#E5191F">redirector</tspan></text>
