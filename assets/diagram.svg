<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 450" width="1400" height="450" role="img" aria-label="cfdirector architecture: beacon traffic passes through a Cloudflare Worker header check and Access service token, over a Zero Trust tunnel, to a C2 server with no open inbound ports on operator infrastructure; traffic without the right header is redirected or 404'd before it ever reaches Access.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c7cbd1"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0575c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="450" fill="#14161a"/>

  <text x="700" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">cfdirector: header-gated Worker + Zero Trust tunnel in front of C2</text>

  <!-- ===================== blocked path ===================== -->
  <path d="M395 260 V135 H1138" fill="none" stroke="#f0575c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowRed)"/>
  <rect x="690" y="118" width="190" height="24" rx="6" fill="#14161a"/>
  <text x="785" y="135" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#f0575c">missing / wrong header</text>

  <rect x="1140" y="90" width="240" height="90" rx="10" fill="#241317" stroke="#f0575c" stroke-width="2"/>
  <rect x="1140" y="90" width="240" height="4" rx="2" fill="#f0575c"/>
  <g transform="translate(1160,112) scale(0.8)" fill="none" stroke="#f0575c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M12 3 L22.5 21 H1.5 Z"/>
    <line x1="12" y1="10" x2="12" y2="15"/>
    <circle cx="12" cy="18" r="0.9" fill="#f0575c" stroke="none"/>
  </g>
  <text x="1200" y="150" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#ffffff">404 / Redirect</text>
  <text x="1200" y="168" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#c99599">scanners &amp; bad headers</text>

  <!-- ===================== beacon ===================== -->
  <rect x="40" y="260" width="150" height="120" rx="10" fill="#1c1f27" stroke="#8a8f98" stroke-width="1.5"/>
  <rect x="40" y="260" width="150" height="4" rx="2" fill="#8a8f98"/>
  <g transform="translate(99,276) scale(1.1)" fill="none" stroke="#dfe2e6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <rect x="2" y="3" width="20" height="14" rx="2"/>
    <line x1="12" y1="17" x2="12" y2="21"/>
    <line x1="8" y1="21" x2="16" y2="21"/>
  </g>
  <text x="115" y="332" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#ffffff">Beacon Traffic</text>
  <text x="115" y="352" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9aa0aa">implant check-ins</text>

  <path d="M190 320 H298" fill="none" stroke="#c7cbd1" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="195" y="300" width="64" height="34" rx="5" fill="#14161a"/>
  <text x="227" y="314" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa0aa">X-Header</text>
  <text x="227" y="327" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa0aa">(secret)</text>

  <!-- ===================== cloudflare container ===================== -->
  <rect x="260" y="210" width="760" height="220" rx="16" fill="#1a1510" stroke="#F6821F" stroke-width="2"/>
  <rect x="280" y="222" width="168" height="28" rx="6" fill="#241a10" stroke="#F6821F" stroke-width="1.3"/>
  <g transform="translate(292,228) scale(0.7)" fill="none" stroke="#F6821F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M7 17 C3.5 17 1 14.6 1 11.6 C1 9 3 7.2 5.4 7 C6.3 4 9.1 2 12.4 2 C16.2 2 19.3 4.7 19.9 8.2 C22.2 8.6 24 10.6 24 13 C24 15.5 21.9 17 19.3 17 Z"/>
  </g>
  <text x="340" y="240" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#F6821F">CLOUDFLARE</text>

  <!-- worker -->
  <rect x="300" y="260" width="190" height="120" rx="10" fill="#211b14" stroke="#F6821F" stroke-width="1.5"/>
  <rect x="300" y="260" width="190" height="4" rx="2" fill="#F6821F"/>
  <g transform="translate(379,276) scale(1.1)" fill="none" stroke="#F6821F" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <rect x="6" y="6" width="12" height="12" rx="1.5"/>
    <line x1="12" y1="1.5" x2="12" y2="6"/>
    <line x1="12" y1="18" x2="12" y2="22.5"/>
    <line x1="1.5" y1="12" x2="6" y2="12"/>
    <line x1="18" y1="12" x2="22.5" y2="12"/>
  </g>
  <text x="395" y="332" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#ffffff">Worker</text>
  <text x="395" y="352" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#c7a071">header + geo check</text>

  <path d="M490 320 H578" fill="none" stroke="#c7cbd1" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="495" y="308" width="78" height="22" rx="6" fill="#14161a"/>
  <text x="534" y="323" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9aa0aa">header valid</text>

  <!-- access -->
  <rect x="580" y="260" width="190" height="120" rx="10" fill="#1c1f27" stroke="#8a8f98" stroke-width="1.5"/>
  <rect x="580" y="260" width="190" height="4" rx="2" fill="#8a8f98"/>
  <g transform="translate(663,278) scale(1.1)" fill="none" stroke="#dfe2e6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="7" cy="8" r="5"/>
    <line x1="11.5" y1="11.5" x2="21.5" y2="21.5"/>
    <line x1="16" y1="16" x2="19" y2="13"/>
    <line x1="19.5" y1="19.5" x2="22.5" y2="16.5"/>
  </g>
  <text x="675" y="332" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#ffffff">Access</text>
  <text x="675" y="352" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9aa0aa">service token check</text>

  <path d="M770 320 H858" fill="none" stroke="#c7cbd1" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="775" y="308" width="68" height="22" rx="6" fill="#14161a"/>
  <text x="809" y="323" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9aa0aa">token ok</text>

  <!-- tunnel -->
  <rect x="860" y="260" width="130" height="120" rx="10" fill="#132019" stroke="#3fb950" stroke-width="1.5"/>
  <rect x="860" y="260" width="130" height="4" rx="2" fill="#3fb950"/>
  <g transform="translate(910,276) scale(1.1)" fill="none" stroke="#3fb950" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M12 2 L21 5.5 V11.5 C21 17 17 20.7 12 22 C7 20.7 3 17 3 11.5 V5.5 Z"/>
    <path d="M8 12 L11 15 L16.5 8.5"/>
  </g>
  <text x="925" y="332" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#ffffff">Zero Trust</text>
  <text x="925" y="352" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8fcf9c">tunnel</text>

  <!-- tunnel -> operator infra, lock badge over the line -->
  <path d="M990 320 H1078" fill="none" stroke="#c7cbd1" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="1021" y="306" width="28" height="28" rx="5" fill="#14161a"/>
  <g transform="translate(1024,309) scale(0.85)" fill="none" stroke="#3fb950" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <rect x="5" y="11" width="14" height="10" rx="1.5"/>
    <path d="M8 11 V8 a4 4 0 0 1 8 0 V11"/>
  </g>
  <text x="1035" y="298" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8fcf9c">encrypted</text>

  <!-- ===================== operator infrastructure container (purple) ===================== -->
  <rect x="1080" y="210" width="300" height="220" rx="16" fill="#1a1427" stroke="#a371f7" stroke-width="2"/>
  <rect x="1100" y="222" width="255" height="28" rx="6" fill="#241935" stroke="#a371f7" stroke-width="1.3"/>
  <g transform="translate(1112,228) scale(0.65)" fill="none" stroke="#a371f7" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <rect x="3" y="3" width="18" height="8" rx="1.5"/>
    <circle cx="7" cy="7" r="1" fill="#a371f7" stroke="none"/>
    <rect x="3" y="14" width="18" height="8" rx="1.5"/>
    <circle cx="7" cy="18" r="1" fill="#a371f7" stroke="none"/>
  </g>
  <text x="1150" y="240" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#a371f7">OPERATOR INFRASTRUCTURE</text>

  <!-- cloudflared -->
  <rect x="1100" y="268" width="260" height="74" rx="10" fill="#241935" stroke="#a371f7" stroke-width="1.3"/>
  <g transform="translate(1116,290) scale(1.05)" fill="none" stroke="#d2a8ff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M5 4 L13 12 L5 20"/>
    <line x1="15" y1="20" x2="21" y2="20"/>
  </g>
  <text x="1160" y="298" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">cloudflared</text>
  <text x="1160" y="317" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#d2a8ff">daemon, outbound only</text>

  <path d="M1230 342 V354" fill="none" stroke="#c7cbd1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1246" y="352" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa0aa">localhost:PORT</text>

  <!-- c2 -->
  <rect x="1100" y="356" width="260" height="74" rx="10" fill="#241935" stroke="#a371f7" stroke-width="1.3"/>
  <g transform="translate(1116,378) scale(1.05)" fill="none" stroke="#d2a8ff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <rect x="2" y="2" width="18" height="8" rx="1.5"/>
    <circle cx="6" cy="6" r="1" fill="#d2a8ff" stroke="none"/>
    <line x1="11" y1="6" x2="17" y2="6"/>
    <rect x="2" y="13" width="18" height="8" rx="1.5"/>
    <circle cx="6" cy="17" r="1" fill="#d2a8ff" stroke="none"/>
    <line x1="11" y1="17" x2="17" y2="17"/>
  </g>
  <text x="1160" y="386" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">C2 Server</text>
  <text x="1160" y="405" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#d2a8ff">localhost only, no inbound ports</text>
</svg>
